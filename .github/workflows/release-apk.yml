name: Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Find gradlew and build
        run: |
          GRADLEW=$(find . -name gradlew | head -n 1)
          echo "Found: $GRADLEW"
          chmod +x "$GRADLEW"
          DIR=$(dirname "$GRADLEW")
          cd "$DIR" && ./gradlew assembleDebug
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: Smart POS v1.0-${{ github.run_number }}
          files: "**/build/outputs/apk/debug/app-debug.apk"
          body: Latest Smart POS APK