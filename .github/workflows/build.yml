name: SMART POS Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build SMART POS v3 - Fixed
        run: |
          echo "=== SMART POS COMMERCIAL ==="
          echo "BusinessID + Roles + Audit Trail"
          mkdir -p app/src/main/java/com/smartpos
          echo "Build 3 Fixed - Ready for POS Code" > app/README.txt
          ls -R
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: SMART-POS-v3-Fixed
          path: app/
