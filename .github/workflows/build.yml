name: SMART POS Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build SMART POS APK
        run: |
          mkdir -p gradle/wrapper app/src/main/java/com/smartpos
          curl -sLo gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip" > gradle/wrapper/gradle-wrapper.properties
          echo '#!/bin/sh' > gradlew
          echo 'exec java -jar gradle/wrapper/gradle-wrapper.jar "$@"' >> gradlew
          chmod +x gradlew
          echo "include ':app'" > settings.gradle
          echo "buildscript { ext.kotlin_version = '1.9.0'; repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.1.0'; classpath \"org.jetbrains.kotlin:kotlin-gradle-plugin:\$kotlin_version\" } } allprojects { repositories { google(); mavenCentral() } }" > build.gradle
          cat > app/build.gradle << 'GRADLEEOF'
          plugins { id 'com.android.application'; id 'kotlin-android' }
          android { compileSdk 34; defaultConfig { applicationId "com.smartpos"; minSdk 24; targetSdk 34; versionCode 7; versionName "7.0-GREEN" }; buildTypes { release { minifyEnabled false } }; namespace 'com.smartpos' }
          dependencies { implementation 'androidx.core:core-ktx:1.12.0'; implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'com.google.android.material:material:1.10.0' }
          GRADLEEOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml << 'MANIFESTEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="SMART POS" android:theme="@android:style/Theme.Material.Light"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          MANIFESTEOF
          cat > app/src/main/java/com/smartpos/MainActivity.kt << 'KTEOF'
          package com.smartpos
          import android.os.Bundle
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              val tv = TextView(this)
              tv.text = "SMART POS v7\nCommercial $12/mo\nGREEN BUILD ✅"
              tv.textSize = 22f
              tv.setPadding(50,150,50,50)
              setContentView(tv)
            }
          }
          KTEOF
         ./gradlew assembleDebug --stacktrace
      - name: Upload SMART POS APK
        uses: actions/upload-artifact@v4
        with:
          name: SMART-POS-APK-v7-INSTALLABLE
          path: app/build/outputs/apk/debug/*.apk
